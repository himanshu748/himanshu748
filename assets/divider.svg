<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05D9E8">
        <animate attributeName="stop-color" values="#05D9E8;#D300C5;#FF2A6D;#05D9E8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#D300C5">
        <animate attributeName="stop-color" values="#D300C5;#FF2A6D;#05D9E8;#D300C5" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#FF2A6D">
        <animate attributeName="stop-color" values="#FF2A6D;#05D9E8;#D300C5;#FF2A6D" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect y="3" width="1200" height="2" rx="1" fill="url(#d)" opacity="0.85"/>
  <rect y="2" width="170" height="4" rx="2" fill="#ffffff" opacity="0.55">
    <animate attributeName="x" values="-170;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
